<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ 3D-печати</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            background-color: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            margin-top: 16px;
        }
        input[type="file"], select, input[type="number"], input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fafafa;
        }
        input[type="file"] {
            padding: 8px;
            background-color: white;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 16px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 24px;
            cursor: pointer;
        }
        button:active {
            background-color: #005bb5;
        }
        #customColorWrapper {
            display: none;
            margin-top: 8px;
        }
        .hint {
            color: #888;
            font-size: 12px;
            display: block;
            margin-top: 4px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background-color: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal h2 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
            color: #2e7d32;
        }
        .modal-icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }
        .modal-message {
            text-align: center;
            font-size: 15px;
            color: #333;
            background-color: #f1f8e9;
            border-radius: 8px;
            padding: 12px;
            margin: 16px 0;
            line-height: 1.4;
        }
        .modal-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .modal-row:last-of-type {
            border-bottom: none;
        }
        .modal-row span:first-child {
            color: #666;
        }
        .modal-row span:last-child {
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }
        .modal button {
            margin-top: 16px;
            background-color: #007AFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Заказать 3D-печать</h1>
        <p id="greeting" style="text-align:center; color:#666; font-size:14px;"></p>

        <form id="orderForm">
            <label for="modelFile">Файл 3D-модели (.stl, .obj)</label>
            <input type="file" id="modelFile" accept=".stl,.obj,.3mf">
            <small class="hint">Необязательно. Можно прикрепить позже.</small>

            <label for="photoFiles">Фотографии</label>
            <input type="file" id="photoFiles" accept="image/*" multiple>
            <small class="hint">Необязательно. Можно выбрать несколько фото.</small>

            <label for="material">Материал</label>
            <select id="material">
                <option value="PLA">PLA (жесткий, экологичный)</option>
                <option value="PETG">PETG (жесткий, универсальный)</option>
                <option value="TPU">TPU (гибкий, резиноподобный)</option>
                <option value="Любой">Любой (на ваше усмотрение)</option>
            </select>

            <label for="color">Цвет</label>
            <select id="color">
                <option value="Черный">Черный</option>
                <option value="Белый">Белый</option>
                <option value="Серый">Серый</option>
                <option value="Красный">Красный</option>
                <option value="Синий">Синий</option>
                <option value="Зеленый">Зеленый</option>
                <option value="custom">— Свой цвет —</option>
            </select>
            <div id="customColorWrapper">
                <input type="text" id="customColor" placeholder="Напишите название или оттенок">
            </div>

            <label for="quantity">Количество (шт.)</label>
            <input type="number" id="quantity" value="1" min="1" max="100">

            <label for="comment">Комментарий</label>
            <input type="text" id="comment" placeholder="Например: нужна поддержка">

            <!-- ОБЯЗАТЕЛЬНОЕ ПОЛЕ: способ связи -->
            <label for="contactMethod">Удобный способ связи *</label>
            <select id="contactMethod" required>
                <option value="">— Выберите способ —</option>
                <option value="Телефонный звонок">Телефонный звонок</option>
                <option value="Сообщение в MAX">Сообщение в MAX</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Telegram">Telegram</option>
            </select>

            <div id="phoneWrapper" style="display:none;">
                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" placeholder="+7 (999) 123-45-67">
                <small class="hint">Необязательно. Но так мы сможем быстрее связаться.</small>
            </div>

            <button type="submit">Отправить заказ</button>
        </form>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-icon">✅</div>
            <h2>Заявка принята!</h2>
            <div class="modal-message">
                Исполнитель работ свяжется с вами в ближайшее время.
            </div>
            <div class="modal-row"><span>Материал</span><span id="mMaterial">—</span></div>
            <div class="modal-row"><span>Цвет</span><span id="mColor">—</span></div>
            <div class="modal-row"><span>Количество</span><span id="mQuantity">—</span></div>
            <div class="modal-row"><span>Связь</span><span id="mContact">—</span></div>
            <button type="button" id="closeModal">Понятно</button>
        </div>
    </div>

    <script src="https://st.max.ru/js/max-web-app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.WebApp && window.WebApp.initDataUnsafe) {
                const user = window.WebApp.initDataUnsafe.user;
                if (user) {
                    document.getElementById('greeting').textContent = 
                        'Здравствуйте, ' + user.first_name + '!';
                }
                window.WebApp.ready();
            } else {
                document.getElementById('greeting').textContent = 
                    'Демонстрационный режим (вне MAX)';
            }

            const colorSelect = document.getElementById('color');
            const customColorWrapper = document.getElementById('customColorWrapper');
            const customColorInput = document.getElementById('customColor');

            const contactMethod = document.getElementById('contactMethod');
            const phoneWrapper = document.getElementById('phoneWrapper');
            const phoneInput = document.getElementById('phone');

            const modalOverlay = document.getElementById('modalOverlay');
            const closeModalBtn = document.getElementById('closeModal');

            let pendingMessage = '';

            // Показ поля "Свой цвет"
            colorSelect.addEventListener('change', function() {
                if (this.value === 'custom') {
                    customColorWrapper.style.display = 'block';
                    customColorInput.focus();
                } else {
                    customColorWrapper.style.display = 'none';
                    customColorInput.value = '';
                }
            });

            // Показ поля телефона при выборе способа связи
            contactMethod.addEventListener('change', function() {
                if (this.value === '') {
                    phoneWrapper.style.display = 'none';
                } else if (this.value === 'Сообщение в MAX') {
                    phoneWrapper.style.display = 'none';
                } else {
                    phoneWrapper.style.display = 'block';
                }
            });

            // Маска для телефона
            phoneInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^\d\s\+\-\(\)]/g, '');
            });

            // Закрытие модального окна — отправляем данные на сервер
            closeModalBtn.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
                sendOrderToBot();
            });

            // Отправка формы
            document.getElementById('orderForm').addEventListener('submit', function(e) {
                e.preventDefault();

                // ЕДИНСТВЕННАЯ ПРОВЕРКА: выбран ли способ связи
                const contact = contactMethod.value;
                if (!contact) {
                    alert('Пожалуйста, выберите удобный способ связи.');
                    contactMethod.focus();
                    return;
                }

                // Сбор данных (все поля, кроме способа связи, могут быть пустыми)
                const fileInput = document.getElementById('modelFile');
                const fileName = fileInput.files[0] ? fileInput.files[0].name : 'не прикреплён';

                let finalColor = colorSelect.value;
                if (finalColor === 'custom') {
                    finalColor = customColorInput.value.trim() || 'не указан';
                }

                const material = document.getElementById('material').value;
                const quantity = document.getElementById('quantity').value || '1';
                const comment = document.getElementById('comment').value.trim() || '—';
                let phone = phoneInput.value.trim();
                if (phoneWrapper.style.display === 'none') phone = '';

                // Формируем текст заявки
                let message = '🔔 Новая заявка на 3D-печать!\n\n';
                message += '📦 Материал: ' + material + '\n';
                message += '🎨 Цвет: ' + finalColor + '\n';
                message += '🔢 Количество: ' + quantity + ' шт.\n';
                message += '📞 Способ связи: ' + contact + '\n';
                if (phone) {
                    message += '☎️ Телефон: ' + phone + '\n';
                }
                message += '💬 Комментарий: ' + comment + '\n';
                message += '📎 Файл модели: ' + fileName;

                pendingMessage = message;

                // Заполняем всплывающее окно
                document.getElementById('mMaterial').textContent = material;
                document.getElementById('mColor').textContent = finalColor;
                document.getElementById('mQuantity').textContent = quantity + ' шт.';
                document.getElementById('mContact').textContent = 
                    phone ? (contact + ' (' + phone + ')') : contact;

                modalOverlay.classList.add('active');
            });

            // ===== ОТПРАВКА ДАННЫХ НА СЕРВЕР RENDER =====
            async function sendOrderToBot() {
                if (!pendingMessage) return;

                // ⚠️ Адрес вашего сервера на Render
                const serverUrl = 'https://max-bot-server.onrender.com/api/order';

                const dataToSend = {
                    initData: window.WebApp ? window.WebApp.initData : '',
                    message: pendingMessage
                };

                console.log('Отправка на сервер:', dataToSend);

                try {
                    const response = await fetch(serverUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(dataToSend)
                    });

                    if (response.ok) {
                        console.log('✅ Заявка успешно отправлена на сервер!');
                    } else {
                        const errorText = await response.text();
                        console.error('❌ Ошибка сервера:', response.status, errorText);
                        alert('Не удалось отправить заявку. Попробуйте ещё раз.');
                    }
                } catch (error) {
                    console.error('❌ Ошибка сети:', error);
                    alert('Ошибка соединения с сервером. Проверьте интернет.');
                }

                pendingMessage = '';
            }
        });
    </script>
</body>
</html>
